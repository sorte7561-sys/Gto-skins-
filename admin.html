<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTO Skins — Admin</title><style>body{font-family:system-ui;background:#090b0d;color:#fff;max-width:1000px;margin:auto;padding:20px}input,select,textarea{background:#11171b;color:#fff;border:1px solid #263039;border-radius:8px;padding:10px;margin:4px}button{padding:10px;border:0;border-radius:8px;background:#19d37b;font-weight:800}.card{border:1px solid #263039;padding:14px;border-radius:12px;margin:10px 0;background:#12161a}.muted{color:#98a5ad}</style></head><body><h1>GTO Skins — Admin</h1><section id="login"><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button onclick="login()">Entrar</button></section><section id="panel" style="display:none"><button onclick="logout()">Sair</button><h2>Novo produto</h2><p class="muted">Para liberar uma compra, altere o pedido para <b>PAGO</b>. O cliente verá o download automaticamente.</p><input id="name" placeholder="Nome"><input id="price" type="number" step="0.01" placeholder="Preço"><input id="category" placeholder="Categoria"><input id="image_url" placeholder="URL da imagem"><input id="download_path" placeholder="Caminho no bucket Skins (ex: caminhao1.zip)"><textarea id="description" placeholder="Descrição"></textarea><button onclick="createProduct()">Cadastrar</button><h2>Pedidos</h2><div id="orders"></div><h2>Produtos</h2><div id="products"></div></section><script src="/admin.js"></script></body></html>
