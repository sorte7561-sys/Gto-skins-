<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTO Skins</title><style>
:root{--bg:#090b0d;--card:#12161a;--line:#263039;--green:#19d37b;--text:#f4f7f8;--muted:#98a5ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}header{position:sticky;top:0;z-index:5;background:#0b0e10ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;gap:18px;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:22px}.logo span{color:var(--green)}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#04130b}.ghost{background:#182027;color:white;border:1px solid var(--line)}.hero{padding:60px 18px 35px;text-align:center}.hero h1{font-size:clamp(36px,7vw,64px);margin:0 0 12px}.hero p{color:var(--muted);max-width:680px;margin:auto;font-size:18px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select,input,textarea{background:#0e1317;border:1px solid var(--line);color:white;border-radius:10px;padding:12px}.tools input{flex:1;min-width:200px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.thumb{aspect-ratio:16/10;background:#0f1316;display:grid;place-items:center;color:#60707a}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.body h3{margin:0 0 6px}.muted{color:var(--muted)}.price{font-size:22px;font-weight:900;margin:12px 0}.cart{position:fixed;right:18px;bottom:18px;background:var(--green);color:#04130b;border-radius:999px;padding:15px 20px;font-weight:900;box-shadow:0 10px 30px #0008}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.box{background:#101519;border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;padding:22px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0}.qr{max-width:230px;margin:12px auto;display:block}.copy{width:100%;word-break:break-all}.empty{text-align:center;color:var(--muted);padding:40px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#172027;border:1px solid var(--line);padding:12px 16px;border-radius:10px;display:none}.toast.show{display:block}</style></head><body><header><div class="wrap nav"><div class="logo">GTO <span>SKINS</span></div><button class="ghost" onclick="openOrders()">Meus pedidos</button></div></header><main><section class="hero"><h1>Skins para sua garagem.</h1><p>Compre suas skins para Global Truck Online. Faça seu pedido e combine o pagamento manual pelo WhatsApp.</p></section><section class="wrap"><div style="text-align:center;margin:20px 0"><button class="primary" onclick="alert('Em breve você poderá solicitar sua skin personalizada!')">🎨 Pedir Skin Personalizada</button></div><div class="tools"><input id="search" placeholder="Buscar skin..." oninput="render()"><select id="cat" onchange="render()"><option value="">Todas as categorias</option><option>Caminhões</option><option>Reboques</option><option>Bitrens</option><option>Rodotrens</option><option>Ônibus</option></select></div><div id="grid" class="grid"></div></section></main><button class="cart" onclick="openCart()">Carrinho (<span id="count">0</span>)</button><div id="modal" class="modal"><div class="box" id="box"></div></div><div id="toast" class="toast"></div><script src="/app.js"></script></body></html>
